spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# New Property Prefix for Spring Cloud Gateway Server WebMVC (v4.x/2025+)
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true

# Auth Routes
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].args.pattern=/api/auth/**

# Course Routes
spring.cloud.gateway.server.webmvc.routes[1].id=course-service
