spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.discovery.locator.enabled=true

# Auth Routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Course Routes
spring.cloud.gateway.routes[1].id=course-service
spring.cloud.gateway.routes[1].uri=lb://course-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/courses/**

# Exam Routes
spring.cloud.gateway.routes[2].id=exam-service
spring.cloud.gateway.routes[2].uri=lb://exam-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/exams/**

# Academic Routes
spring.cloud.gateway.routes[3].id=academic-service
spring.cloud.gateway.routes[3].uri=lb://academic-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/academic/**

# Finance Routes
spring.cloud.gateway.routes[4].id=finance-service
spring.cloud.gateway.routes[4].uri=lb://finance-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/finance/**

# Placement Routes
spring.cloud.gateway.routes[5].id=placement-service
spring.cloud.gateway.routes[5].uri=lb://placement-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/placements/**






